# Build number = github.run_number: renaming this file resets it, and App Store
# Connect rejects non-increasing build numbers. Setup: README.md → TestFlight.
name: TestFlight

on:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "Makefile"
      - ".swiftlint.yml"
      - ".swiftformat"
      - ".github/workflows/testflight.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      PROJECT_PATH: apps/ios/Poopita.xcodeproj
      SCHEME: Poopita
      BUNDLE_ID: com.ayungavis.Poopita
      TEAM_ID: QHL64K2LPL
      PROVISIONING_PROFILE_NAME: Poopita Apple Distribution
      BUILD_NUMBER: ${{ github.run_number }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate credentials and app environment
        env:
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_CERTIFICATES_FILE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          APPSTORE_CERTIFICATES_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
        run: |
          missing=0
          for name in APPSTORE_ISSUER_ID APPSTORE_API_KEY_ID APPSTORE_API_PRIVATE_KEY \
            APPSTORE_CERTIFICATES_FILE_BASE64 APPSTORE_CERTIFICATES_PASSWORD API_BASE_URL SENTRY_DSN; do
            [ -n "${!name}" ] || { echo "Missing GitHub secret/variable $name"; missing=1; }
          done
          exit $missing

      - run: brew install xcodegen
      - run: make ios-generate

      # Sentry ships binary targets via GitHub Releases; downloads occasionally 500 on runners.
      - name: Resolve packages (retry on flaky release downloads)
        run: |
          for i in 1 2 3; do
            xcodebuild -project "$PROJECT_PATH" -scheme "$SCHEME" -resolvePackageDependencies && exit 0
            echo "resolve attempt $i failed; retrying in 20s"
            sleep 20
          done
          exit 1

      - name: Import code signing certificates
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download provisioning profiles
        uses: Apple-Actions/download-provisioning-profiles@v6
        with:
          profile-type: IOS_APP_STORE
          bundle-id: ${{ env.BUNDLE_ID }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Create export options plist
        run: |
          mkdir -p .build
          cat > .build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROVISIONING_PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Archive app
        run: >
          xcodebuild
          -project "$PROJECT_PATH"
          -scheme "$SCHEME"
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath .build/Archives/Poopita.xcarchive
          -derivedDataPath .build/DerivedData
          -resultBundlePath .build/PoopitaArchive.xcresult
          CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          API_BASE_URL="$API_BASE_URL"
          SENTRY_DSN="$SENTRY_DSN"
          archive

      - name: Export IPA
        run: >
          xcodebuild
          -exportArchive
          -archivePath .build/Archives/Poopita.xcarchive
          -exportPath .build/export
          -exportOptionsPlist .build/ExportOptions.plist

      - name: Upload TestFlight build
        uses: Apple-Actions/upload-testflight-build@v5
        with:
          app-path: .build/export/Poopita.ipa
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Upload result bundles on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: .build/**/*.xcresult
